# Prüft das Modul bei jedem Push und Pull-Request (Hausstil, in allen Repositorys gleich).
# SPDX-License-Identifier: MIT
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3 entspricht älteren Symcon-Versionen, 8.5 ist in Symcon 9.0 enthalten
        php: ['8.3', '8.5']

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, gd, mbstring, fileinfo, sodium
          tools: phpunit:10
          coverage: none

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './.git/*' -not -path './tests/stubs/*' -print0 | xargs -0 -n1 php -l

      - name: JSON-Dateien prüfen
        run: |
          for f in library.json */module.json */form.json */locale.json; do
            [ -f "$f" ] || continue
            php -r 'json_decode(file_get_contents($argv[1]), flags: JSON_THROW_ON_ERROR);' "$f" || { echo "Ungültig: $f"; exit 1; }
          done

      - name: Strukturprüfung (Hausstil)
        run: php tests/structure.php

      - name: Tests ausführen
        if: hashFiles('tests/run.php') != ''
        run: php tests/run.php

      - name: Offizielle Symcon-Stubs holen
        if: hashFiles('tests/stubs.php') != ''
        run: git clone --depth 1 https://github.com/symcon/SymconStubs.git ../SymconStubs

      - name: Ladetest mit den Symcon-Stubs
        if: hashFiles('tests/stubs.php') != ''
        run: php tests/stubs.php ../SymconStubs

      - name: Symcon-Stubs für PHPUnit holen
        if: hashFiles('phpunit.xml') != ''
        run: git clone --depth 1 https://github.com/symcon/SymconStubs.git tests/stubs

      - name: PHPUnit
        if: hashFiles('phpunit.xml') != ''
        run: phpunit --configuration phpunit.xml
