<style>
    :root {
        --pv: #ffc94a;
        --bat: #4fe3b4;
        --bat2: #22b8cf;
        --home: #5aa9ff;
        --txt: var(--content-color, #eef1f6);
        --muted: rgba(178, 186, 200, .95);
        --card: rgba(20, 24, 32, .42);
        --card-b: rgba(190, 200, 215, .14);
        --track: rgba(170, 180, 195, .18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
        font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--txt);
        font-size: clamp(10px, 2.6vmin, 15px);
        -webkit-font-smoothing: antialiased;
    }

    /* Hintergrund */
    #bgScene, #bgImg { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: opacity 1s; }
    #bgScene svg { width: 100%; height: 100%; display: block; }
    #bgImg { background-size: cover; background-position: center; }
    #bgShade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(10, 13, 20, .35) 0%, rgba(10, 13, 20, .05) 35%, rgba(10, 13, 20, .45) 100%); }
    .hidden { display: none !important; }

    /* Platz für Titel und Vergrößern-Symbol, die Symcon über die Kachel legt */
    .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
        padding: clamp(34px, 10vh, 62px) clamp(8px, 2.5vw, 18px) clamp(8px, 2.5vh, 16px); }
    .main { flex: 1; min-height: 0; display: grid; gap: clamp(6px, 2vmin, 16px); grid-template-rows: 1fr auto; grid-template-columns: 1fr; }
    @media (min-aspect-ratio: 5/4) {
        .main { grid-template-columns: 1fr minmax(130px, 31%); grid-template-rows: 1fr; }
        .stats { grid-template-columns: 1fr !important; align-content: center; }
    }
    .flow { width: 100%; height: 100%; min-height: 0; overflow: visible; }

    /* Info-Spalte */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(5px, 1.4vmin, 9px); align-content: start; }
    .glass { background: var(--card); border: 1px solid var(--card-b); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .pill {
        grid-column: 1 / -1; display: flex; align-items: center; gap: .55em;
        padding: .5em .9em; border-radius: 999px; font-weight: 600; letter-spacing: .01em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dot { width: .6em; height: .6em; border-radius: 50%; background: var(--muted); flex: none; }
    .pill.charge { color: var(--bat); }   .pill.charge .dot { background: var(--bat); animation: pulse 2s infinite; }
    .pill.discharge { color: var(--pv); } .pill.discharge .dot { background: var(--pv); animation: pulseY 2s infinite; }
    .pill.idle { color: var(--muted); }
    .pill.offline { color: #ff7d7d; }     .pill.offline .dot { background: #ff7d7d; }
    @keyframes pulse  { 0% { box-shadow: 0 0 0 0 rgba(79, 227, 180, .6); } 70%, 100% { box-shadow: 0 0 0 .6em rgba(79, 227, 180, 0); } }
    @keyframes pulseY { 0% { box-shadow: 0 0 0 0 rgba(255, 201, 74, .6); } 70%, 100% { box-shadow: 0 0 0 .6em rgba(255, 201, 74, 0); } }

    .card { border-radius: clamp(10px, 2vmin, 14px); padding: clamp(6px, 1.6vmin, 11px) clamp(8px, 2vmin, 13px); min-width: 0;
        display: flex; flex-direction: column; gap: .25em; }
    .k { font-size: .76em; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: .45em; white-space: nowrap; }
    .k svg { width: 1.15em; height: 1.15em; flex: none; }
    .v { font-size: 1.35em; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v small { font-size: .62em; font-weight: 600; color: var(--muted); margin-left: .18em; }
    .bar { height: .38em; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: .2em; }
    .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--bat2), var(--bat)); transition: width .8s ease; }
    @media (max-height: 320px) {
        .card { padding: 4px 8px; gap: 0; }
        .v { font-size: 1.12em; }
        .k { font-size: .68em; }
        .bar { display: none; }
    }
    @media (max-height: 250px) { .opt { display: none !important; } .k svg { display: none; } }
    .nodeG { transition: opacity .6s; }
    .nodeG.idle { opacity: .5; }

    /* Grafik */
    .track { fill: none; stroke: var(--track); stroke-width: 2.4; stroke-linecap: round; }
    .live  { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: 0; transition: opacity .5s; }
    .live.on { opacity: .6; }
    .nodeBg { fill: url(#glass); }
    .nodeRing { fill: none; stroke-width: 1.6; }
    .halo { opacity: 0; transition: opacity .6s; }
    .halo.on { opacity: .55; }
    .val { font-weight: 700; font-size: 14.5px; paint-order: stroke; stroke: rgba(10, 13, 20, .55); stroke-width: 3px; stroke-linejoin: round; }
    .lbl { font-size: 9.5px; fill: var(--muted); letter-spacing: .05em; text-transform: uppercase; paint-order: stroke; stroke: rgba(10, 13, 20, .5); stroke-width: 2.5px; }
    .tag { font-size: 9.5px; font-weight: 600; fill: var(--txt); text-anchor: middle; }
    .tagBg { fill: rgba(20, 24, 32, .8); stroke: var(--track); }
</style>

<div id="bgScene" class="hidden"></div>
<div id="bgImg" class="hidden"></div>
<div id="bgShade" class="hidden"></div>

<div class="app">
    <div class="main">
        <svg id="flow" class="flow" viewBox="0 0 420 255" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="stats">
            <div id="pill" class="pill glass idle opt"><span class="dot"></span><span id="pillTxt">–</span></div>
            <div class="card glass">
                <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/></svg>Akku</div>
                <div class="v" id="cSoc">–</div>
                <div class="bar"><i id="cSocBar"></i></div>
            </div>
            <div class="card glass opt">
                <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="cTimeK">Restzeit</span></div>
                <div class="v" id="cTime">–</div>
            </div>
            <div class="card glass">
                <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Ertrag heute</div>
                <div class="v" id="cEnergy">–</div>
            </div>
            <div class="card glass">
                <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Akku-Temp.</div>
                <div class="v" id="cTemp">–</div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.getElementById('flow');
    var lastLayout = null, bgMode = 'none', isDay = null;

    // ---------- Hintergrund-Szene (Tag/Nacht) ----------
    function sceneSvg(day) {
        var sky = day
            ? '<stop offset="0" stop-color="#1d4e89"/><stop offset=".55" stop-color="#2f7fb8"/><stop offset="1" stop-color="#7cc4d8"/>'
            : '<stop offset="0" stop-color="#070b18"/><stop offset=".6" stop-color="#131c38"/><stop offset="1" stop-color="#25335a"/>';
        var orb = day
            ? '<circle cx="640" cy="70" r="120" fill="url(#sSun)"/><circle cx="640" cy="70" r="26" fill="#fff4c8" opacity=".9"/>'
            : '<circle cx="640" cy="70" r="90" fill="url(#sMoonGlow)"/><circle cx="640" cy="70" r="16" fill="#e8ecff" opacity=".85"/><circle cx="647" cy="65" r="14" fill="#131c38" opacity=".9"/>';
        var stars = '';
        if (!day) {
            for (var i = 0; i < 40; i++) {
                var x = (i * 97.3) % 800, y = (i * 53.7) % 210, r = (i % 3) * .4 + .5;
                stars += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="#fff" opacity="' + (.25 + (i % 4) * .15) + '"/>';
            }
        }
        var panelFill = day ? '#1d3557' : '#0d1428';
        var hill1 = day ? '#2c6e7f' : '#121b33', hill2 = day ? '#225866' : '#0c1326', ground = day ? '#1b4a55' : '#090f1f';
        var win = day ? '#ffe8a3' : '#ffcf6b';
        return '<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" xmlns="' + NS + '">' +
            '<defs><linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">' + sky + '</linearGradient>' +
            '<radialGradient id="sSun"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>' +
            '<radialGradient id="sMoonGlow"><stop offset="0" stop-color="#9fb4ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/></radialGradient>' +
            '<linearGradient id="sPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cc7"/><stop offset="1" stop-color="' + panelFill + '"/></linearGradient></defs>' +
            '<rect width="800" height="450" fill="url(#sSky)"/>' + stars + orb +
            '<path d="M0 330 C 120 285, 230 300, 340 320 S 560 290, 800 315 V450 H0z" fill="' + hill1 + '" opacity=".9"/>' +
            '<path d="M0 365 C 160 340, 300 350, 450 362 S 680 345, 800 358 V450 H0z" fill="' + hill2 + '"/>' +
            // Haus mit Solarmodulen
            '<g transform="translate(470 278)">' +
            '<path d="M0 70 L80 20 L160 70 V130 H0z" fill="' + (day ? '#e8edf3' : '#1a2440') + '" opacity=".95"/>' +
            '<path d="M-8 74 L80 14 L168 74" fill="none" stroke="' + (day ? '#5a6b80' : '#2a3658') + '" stroke-width="10" stroke-linejoin="round"/>' +
            '<g transform="skewX(-28) translate(52 36)"><rect width="78" height="26" rx="2" fill="url(#sPanel)" opacity=".95"/>' +
            '<path d="M19.5 0v26M39 0v26M58.5 0v26M0 13h78" stroke="#bcd4f2" stroke-width=".8" opacity=".6"/></g>' +
            '<rect x="28" y="88" width="24" height="22" rx="2" fill="' + win + '" opacity="' + (day ? .35 : .85) + '"/>' +
            '<rect x="108" y="88" width="24" height="22" rx="2" fill="' + win + '" opacity="' + (day ? .35 : .85) + '"/>' +
            '<rect x="70" y="96" width="20" height="34" rx="2" fill="' + (day ? '#7c8ea5' : '#2a3658') + '"/></g>' +
            // Speicher-Box neben dem Haus
            '<g transform="translate(640 372)"><rect width="34" height="36" rx="5" fill="' + (day ? '#dfe6ee' : '#1f2a48') + '"/>' +
            '<rect x="6" y="8" width="22" height="4" rx="2" fill="#4fe3b4" opacity=".9"/></g>' +
            '<path d="M0 400 C 200 388, 420 396, 800 390 V450 H0z" fill="' + ground + '"/>' +
            '</svg>';
    }

    function applyBackground(bg, day) {
        if (bg) bgMode = bg.mode || 'none';
        var scene = document.getElementById('bgScene'), img = document.getElementById('bgImg'), shade = document.getElementById('bgShade');
        scene.classList.toggle('hidden', bgMode !== 'scene');
        img.classList.toggle('hidden', bgMode !== 'image');
        shade.classList.toggle('hidden', bgMode === 'none');
        if (bg && bgMode === 'image' && bg.image) {
            img.style.backgroundImage = 'url("' + bg.image + '")';
            img.style.opacity = String(bg.opacity);
        }
        if (bgMode === 'scene' && day !== undefined && day !== isDay) {
            isDay = day;
            scene.innerHTML = sceneSvg(day);
            scene.style.opacity = day ? '.55' : '.7';
        }
    }

    // ---------- Energiefluss ----------
    var ICON = {
        panel: '<path d="M4 4h16l-2 10H6z"/><path d="M5 9h14M10 4l-1 10M14 4l1 10M12 14v5M8 19h8"/>',
        bat:   '<rect x="3" y="7" width="15" height="10" rx="2"/><path d="M21 11v2M10.5 9l-2 3h3l-2 3"/>',
        hub:   '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M12.5 8.5l-2.5 3.5h4l-2.5 3.5"/><path d="M2 12h2M20 12h2"/>',
        inv:   '<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M7.5 12c1.2-2.4 2.3-2.4 3.5 0s2.3 2.4 3.5 0 1.6-1.6 2-1"/>',
        home:  '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M12.5 12l-2 3h3l-2 3"/>'
    };

    function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
    }

    function defs() {
        var d = el('defs', {}, svg);
        d.innerHTML =
            '<radialGradient id="glass" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#3d4552" stop-opacity=".92"/><stop offset="1" stop-color="#161a22" stop-opacity=".92"/></radialGradient>' +
            '<linearGradient id="gPv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff9f2e"/></linearGradient>' +
            '<linearGradient id="gBat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef0c0"/><stop offset="1" stop-color="#22b8cf"/></linearGradient>' +
            '<linearGradient id="gHome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cb6ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>' +
            '<linearGradient id="gHub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f4f9"/><stop offset="1" stop-color="#9aa4b4"/></linearGradient>' +
            '<filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>' +
            '<filter id="spark" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
    }

    var COLORS = { Pv: '#ffd86b', Bat: '#5ef0c0', Home: '#8cc4ff', Hub: '#f1f4f9' };
    var LAYOUTS = {
        simple: {
            nodes: {
                pv:   { x: 70,  y: 62,  c: 'Pv',   i: 'panel', l: 'Solar' },
                bat:  { x: 70,  y: 188, c: 'Bat',  i: 'bat',   l: 'Akku', ring: true },
                hub:  { x: 210, y: 125, c: 'Hub',  i: 'hub',   l: 'Hub', small: true },
                home: { x: 350, y: 125, c: 'Home', i: 'home',  l: 'Haus' }
            },
            links: {
                pv:  { d: 'M96 62 C 150 62, 150 125, 186 125', c: 'Pv' },
                bat: { d: 'M96 188 C 150 188, 150 125, 186 125', c: 'Bat' },
                out: { d: 'M234 125 H 324', c: 'Home' }
            }
        },
        inverter: {
            nodes: {
                pv:     { x: 55,  y: 62,  c: 'Pv',   i: 'panel', l: 'Solar Hub' },
                bat:    { x: 55,  y: 188, c: 'Bat',  i: 'bat',   l: 'Akku', ring: true },
                hub:    { x: 160, y: 125, c: 'Hub',  i: 'hub',   l: 'Hub', small: true },
                direct: { x: 275, y: 38,  c: 'Pv',   i: 'panel', l: 'Solar direkt', side: true },
                inv:    { x: 275, y: 125, c: 'Hub',  i: 'inv',   l: 'Wechselrichter', small: true },
                home:   { x: 375, y: 125, c: 'Home', i: 'home',  l: 'Haus' }
            },
            links: {
                pv:     { d: 'M81 62 C 125 62, 125 125, 138 125', c: 'Pv' },
                bat:    { d: 'M81 188 C 125 188, 125 125, 138 125', c: 'Bat' },
                out:    { d: 'M182 125 H 253', c: 'Hub', tag: { x: 217, y: 125 } },
                direct: { d: 'M275 64 V 103', c: 'Pv' },
                ac:     { d: 'M297 125 H 349', c: 'Home' }
            }
        }
    };

    var refs = {};

    function build(name) {
        svg.innerHTML = '';
        refs = { nodes: {}, links: {} };
        defs();
        var L = LAYOUTS[name];
        var gLinks = el('g', {}, svg), gNodes = el('g', {}, svg);

        Object.keys(L.links).forEach(function (k) {
            var o = L.links[k];
            el('path', { d: o.d, 'class': 'track' }, gLinks);
            var live = el('path', { d: o.d, 'class': 'live', stroke: 'url(#g' + o.c + ')', id: 'p_' + k }, gLinks);
            var parts = el('g', { filter: 'url(#spark)' }, gLinks);
            var r = { live: live, parts: parts, color: o.c, key: '' };
            if (o.tag) {
                r.tagG = el('g', {}, gLinks);
                el('rect', { x: o.tag.x - 23, y: o.tag.y - 20, width: 46, height: 14, rx: 7, 'class': 'tagBg' }, r.tagG);
                r.tag = el('text', { x: o.tag.x, y: o.tag.y - 10, 'class': 'tag' }, r.tagG);
            }
            refs.links[k] = r;
        });

        Object.keys(L.nodes).forEach(function (k) {
            var n = L.nodes[k], R = n.small ? 22 : 26;
            var g = el('g', { 'class': 'nodeG' }, gNodes);
            var halo = el('circle', { cx: n.x, cy: n.y, r: R + 4, fill: 'url(#g' + n.c + ')', filter: 'url(#soft)', 'class': 'halo' }, g);
            el('circle', { cx: n.x, cy: n.y, r: R, 'class': 'nodeBg' }, g);
            el('circle', { cx: n.x, cy: n.y, r: R, 'class': 'nodeRing', stroke: 'url(#g' + n.c + ')', opacity: n.ring ? .25 : .9 }, g);
            var soc = null;
            if (n.ring) {
                var C = 2 * Math.PI * R;
                soc = el('circle', { cx: n.x, cy: n.y, r: R, fill: 'none', stroke: 'url(#gBat)', 'stroke-width': 3, 'stroke-linecap': 'round',
                    'stroke-dasharray': C, 'stroke-dashoffset': C, transform: 'rotate(-90 ' + n.x + ' ' + n.y + ')' }, g);
                soc.style.transition = 'stroke-dashoffset .8s ease';
                soc._c = C;
            }
            var s = n.small ? 18 : 22;
            var ic = el('svg', { x: n.x - s / 2, y: n.y - s / 2, width: s, height: s, viewBox: '0 0 24 24', fill: 'none',
                stroke: 'url(#g' + n.c + ')', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
            ic.innerHTML = ICON[n.i];

            var anchor = n.side ? 'start' : 'middle';
            var vx = n.side ? n.x + R + 9 : n.x, vy = n.side ? n.y + 1 : n.y + R + 18;
            var ly = n.side ? n.y + 14 : n.y + R + (n.small ? 16 : 31);
            var val = el('text', { x: vx, y: vy, 'class': 'val', 'text-anchor': anchor, fill: 'url(#g' + n.c + ')' }, g);
            var lbl = el('text', { x: vx, y: ly, 'class': 'lbl', 'text-anchor': anchor }, g);
            lbl.textContent = n.l;
            if (n.small) val.style.display = 'none';
            refs.nodes[k] = { g: g, halo: halo, val: val, lbl: lbl, soc: soc };
        });
    }

    function fmtW(w) {
        w = Math.abs(Math.round(w || 0));
        return w >= 1000 ? (w / 1000).toFixed(2).replace('.', ',') + ' kW' : w + ' W';
    }
    function fmtTime(min) {
        if (min === null || min === undefined || min <= 0 || min >= 59940) return null;
        var h = Math.floor(min / 60), m = Math.round(min % 60);
        return h > 0 ? h + ' h ' + (m < 10 ? '0' : '') + m + ' min' : m + ' min';
    }
    function num(v, d) { return (v === null || v === undefined) ? null : Number(v).toFixed(d).replace('.', ','); }
    function has(v) { return v !== null && v !== undefined; }

    // Leuchtende Punkte, die entlang der Leitung fließen
    function setFlow(k, watt, reverse) {
        var r = refs.links[k];
        if (!r) return;
        var on = watt > 0;
        r.live.classList.toggle('on', on);
        var count = !on ? 0 : watt < 60 ? 1 : watt < 400 ? 2 : 3;
        var dur = !on ? 0 : Math.max(0.9, Math.min(3.2, 3.6 - Math.log10(Math.max(watt, 1)) * 0.85));
        var key = count + '|' + dur.toFixed(1) + '|' + (reverse ? 1 : 0);
        if (key === r.key) return;
        r.key = key;
        r.parts.innerHTML = '';
        for (var i = 0; i < count; i++) {
            var c = el('circle', { r: 2.6, fill: COLORS[r.color] }, r.parts);
            var a = el('animateMotion', { dur: dur + 's', repeatCount: 'indefinite', begin: (-(dur / count) * i) + 's',
                keyPoints: reverse ? '1;0' : '0;1', keyTimes: '0;1', calcMode: 'linear' }, c);
            var m = el('mpath', { href: '#p_' + k }, a);
            m.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#p_' + k);
        }
    }
    function setNode(k, watt, txt) {
        var n = refs.nodes[k];
        if (!n) return;
        n.halo.classList.toggle('on', watt > 0);
        n.g.classList.toggle('idle', !(watt > 0));
        if (txt !== undefined) n.val.textContent = txt;
    }

    function render(s) {
        var hasInv = has(s.inverter);
        var layout = hasInv ? 'inverter' : 'simple';
        if (layout !== lastLayout) { build(layout); lastLayout = layout; }

        var pv = s.solar || 0, out = s.home || 0, bat = s.battery || 0, soc = s.soc;
        var charging = bat > 0, discharging = bat < 0;
        var direct = 0, ac = 0, est = true;

        setNode('pv', pv, fmtW(pv));
        setNode('bat', Math.abs(bat), fmtW(bat));
        setNode('hub', 1);
        setFlow('pv', pv);
        setFlow('bat', Math.abs(bat), charging);
        refs.nodes.bat.lbl.textContent = 'Akku' + (s.packs > 1 ? ' · ' + s.packs + 'x' : '');
        var socEl = refs.nodes.bat.soc;
        socEl.setAttribute('stroke-dashoffset', socEl._c * (1 - Math.max(0, Math.min(100, soc || 0)) / 100));

        if (hasInv) {
            ac = s.inverter || 0;
            est = !has(s.direct);
            direct = est ? Math.max(0, Math.round(ac / 0.96 - out)) : s.direct;
            setNode('direct', direct, fmtW(direct));
            setNode('inv', ac);
            setNode('home', ac, fmtW(ac));
            setFlow('out', out);
            setFlow('direct', direct);
            setFlow('ac', ac);
            var r = refs.links.out;
            r.tag.textContent = fmtW(out);
            r.tagG.style.display = out > 0 ? '' : 'none';
            var dc = out + direct;
            var eff = !est && ac > 20 && dc > 20 ? Math.min(100, Math.round(ac / dc * 100)) : null;
            refs.nodes.inv.lbl.textContent = eff ? 'WR · ' + eff + ' %' : 'Wechselrichter';
        } else {
            setNode('home', out, fmtW(out));
            setFlow('out', out);
        }

        // Info-Spalte
        var pill = document.getElementById('pill'), txt = document.getElementById('pillTxt');
        pill.className = 'pill glass opt';
        if (!s.online) { pill.classList.add('offline'); txt.textContent = 'Offline'; }
        else if (charging) { pill.classList.add('charge'); txt.textContent = 'Lädt'; }
        else if (discharging) { pill.classList.add('discharge'); txt.textContent = 'Entlädt'; }
        else { pill.classList.add('idle'); txt.textContent = 'Ruhezustand'; }
        if (s.online && s.bypass) txt.textContent += ' · Bypass';

        document.getElementById('cSoc').innerHTML = has(soc) ? soc + '<small>%</small>' : '–';
        document.getElementById('cSocBar').style.width = Math.max(0, Math.min(100, soc || 0)) + '%';

        var t = charging ? fmtTime(s.remainCharge) : discharging ? fmtTime(s.remainDischarge) : null;
        document.getElementById('cTimeK').textContent = charging ? 'Voll in' : 'Restzeit';
        document.getElementById('cTime').textContent = t || '–';

        var e = has(s.energyPlant) ? s.energyPlant : s.energyHub;
        document.getElementById('cEnergy').innerHTML = has(e) ? num(e, 2) + '<small>kWh</small>' : '–';
        document.getElementById('cTemp').innerHTML = has(s.temp) ? num(s.temp, 1) + '<small>°C</small>' : '–';

        // Tag, solange die Sonne liefert (sonst Uhrzeit)
        var hour = new Date().getHours();
        var day = (pv + direct) > 5 || (pv + direct === 0 && hour >= 7 && hour < 19 && s.online === false);
        applyBackground(s.background, day);
    }

    var state = {};
    window.handleMessage = function (data) {
        try {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            for (var k in d) state[k] = d[k];   // Teil-Updates (z. B. nur Hintergrund) zusammenführen
            render(state);
        } catch (e) { }
    };

    window.handleMessage(__INITIAL_STATE__);
})();
</script>
